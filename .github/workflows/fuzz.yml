name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_envelope, fuzz_key_derivation, fuzz_decrypt]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        - name: Install cargo-fuzz
          run: cargo install cargo-fuzz
      - name: Run fuzz target
        run: |
          cd fuzz
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 || true
